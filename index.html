<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Hend ❤️</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #020617 0%, #0b1329 50%, #1e3a8a 100%); 
            background-attachment: fixed;
            overflow-x: hidden; 
        }
        
        /* نظام شلال النجوم المتساقطة من الأعلى */
        .stars { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 1; top: 0; left: 0; }
        .star { position: absolute; background: #ffffff; border-radius: 50%; animation: waterfall 5s linear infinite; box-shadow: 0 0 10px #ffffff, 0 0 20px #60a5fa; }
        @keyframes waterfall { 
            0% { transform: translateY(-10vh) scale(0); opacity: 0; } 
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) scale(1); opacity: 0; } 
        }

        .screen { display: none; width: 100%; min-height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 2; text-align: center; }
        .active { display: flex !important; }

        /* شاشة الدخول الفخمة لـ هند */
        #welcome-screen { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: white; }

        .content-wrapper { 
            max-width: 550px; 
            width: 100%; 
            color: #ffffff;
            padding: 10px;
            z-index: 3;
        }

        /* اسم Hend المضيء والمتوهج */
        .name-title { 
            font-size: 5.5rem; 
            font-weight: 900; 
            margin-bottom: 25px; 
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.6), 0 0 40px rgba(96, 165, 250, 0.3);
            letter-spacing: 3px;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
        
        .btn { background-color: #2563eb; color: white; border: none; padding: 14px 50px; font-size: 1.15rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 25px; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4); border: 1px solid rgba(255,255,255,0.1); }
        .btn:hover { background-color: #1d4ed8; transform: translateY(-3px); box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6); }
        .btn-continue { background-color: white; color: #1e3a8a; box-shadow: 0 4px 20px rgba(255,255,255,0.2); }
        .btn-continue:hover { background-color: #f8fafc; color: #0f172a; }

        /* فريم زجاجي شفاف للتاريخ والوقت مع حواف مضيئة نيون */
        .timer-frame {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(96, 165, 250, 0.7);
            box-shadow: 0 0 25px rgba(96, 165, 250, 0.3), inset 0 0 15px rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 25px 20px;
            margin: 25px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* تنسيق أسطر الوقت بشكل احترافي */
        .timer-box { font-size: 1.3rem; font-weight: bold; color: #ffffff; line-height: 1.7; }
        .timer-days { font-size: 1.75rem; color: #60a5fa; margin-bottom: 10px; font-weight: 800; display: block; text-shadow: 0 0 15px rgba(96, 165, 250, 0.5); }
        .timer-sub { font-size: 1.25rem; color: #e2e8f0; display: block; font-weight: 500; }
        
        /* تنسيق الرسالة الطويلة */
        .love-letter { 
            font-size: 1.25rem; 
            line-height: 2.1; 
            color: #f8fafc; 
            margin: 35px 0; 
            padding: 0 10px;
            text-align: right; 
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            font-weight: 400;
        }
        
        .gallery { display: flex; flex-direction: column; gap: 25px; margin-top: 25px; width: 100%; }
        .gallery img { 
            width: 100%; 
            height: auto; 
            max-height: 480px;
            object-fit: contain; 
            border-radius: 24px; 
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- حاوية شلال النجوم -->
    <div class="stars" id="starsBox"></div>

    <!-- الشاشة 1: الدخول باسم هند -->
    <div id="welcome-screen" class="screen active">
        <div class="name-title">Hend</div>
        <button class="btn btn-continue" onclick="startSite()">Continue</button>
    </div>

    <!-- الشاشة 2: الوقت والرسالة وفريم التاريخ المنسق -->
    <div id="counter-screen" class="screen">
        <div class="content-wrapper">
            <h2 style="color: #60a5fa; margin-top: 0; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.6); font-weight: 800;">تاريخ أول لقاء جمعنا 📅</h2>
            <p style="color: #cbd5e1; font-size: 1.1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin: 5px 0;">عرفتك في يوم: <span id="start-date-text" style="color: #ffffff; font-weight: bold;"></span></p>
            
            <!-- فريم التاريخ الزجاجي المنسق والجميل -->
            <div class="timer-frame">
                <div id="timer" class="timer-box">
                    <span class="timer-days" id="days-part">جاري الحساب...</span>
                    <span class="timer-sub" id="sub-part"></span>
                </div>
            </div>
            
            <div class="love-letter">
                عايز اقولك مهما بعدنا هفضل احبك لاني اول مره الاحساس دا احسو مع حد بحبك جدا وهفضل احبك عمري كلو ي كل عمري وربنا يخليكي ليا ونفضل سوا ي حبيبت عيني بحبك لاخر عمري ❤️
            </div>
            
            <button class="btn" onclick="goPhotos()">Next</button>
        </div>
    </div>

    <!-- الشاشة 3: ألبوم الصور -->
    <div id="photos-screen" class="screen" style="overflow-y: auto; padding: 40px 20px;">
        <div class="content-wrapper">
            <h2 style="color: #60a5fa; margin-top: 0; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.6); font-weight: 800;">ألبوم ذكرياتنا الصغير 📸</h2>
            
            <div class="gallery">
                <img src="8769389a-ace4-4a42-9042-24cb4bd1e8d3.jpeg" alt="ذكرياتنا 1">
                <img src="9f6e1918-184b-4c7d-8449-315e47806090.jpeg" alt="ذكرياتنا 2">
                <img src="bc1f4af7-96c2-4d4b-900b-4c5eb9664e57.jpeg" alt="ذكرياتنا 3">
                <img src="fdff31ee-5eed-4069-b941-f52f8aa999ec.jpeg" alt="ذكرياتنا 4">
            </div>
            
            <button class="btn" style="background-color: #475569;" onclick="goBack()">رجوع</button>
        </div>
    </div>

    <!-- تم تعديل اسم الملف هنا برمجياً ليتطابق مع اسم الأغنية الحالي على السيرفر -->
    <audio id="bg-music" loop>
        <source src="song.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        // كود شلال النجوم
        const box = document.getElementById('starsBox');
        for (let i = 0; i < 45; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.left = (Math.random() * 100) + "vw";
            s.style.top = (Math.random() * -20) + "vh";
            s.style.animationDelay = (Math.random() * 6) + "s";
            s.style.animationDuration = (4 + Math.random() * 4) + "s";
            let size = 2 + Math.random() * 3;
            s.style.width = s.style.height = size + "px";
            box.appendChild(s);
        }

        function startSite() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('counter-screen').classList.add('active');
            var audio = document.getElementById('bg-music');
            if(audio) {
                audio.play().catch(function(e){ console.log(e) });
            }
        }

        function goPhotos() {
            document.getElementById('counter-screen').classList.remove('active');
            document.getElementById('photos-screen').classList.add('active');
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('photos-screen').classList.remove('active');
            document.getElementById('counter-screen').classList.add('active');
        }

        // تاريخ التعارف الجديد المعتمد (23/4/2024)
        const d = new Date(2024, 3, 23); 
        document.getElementById('start-date-text').innerText = "23/4/2024";

        setInterval(function() {
            const diff = new Date() - d;
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            
            document.getElementById("days-part").innerHTML = "بقالنا سوا: ✨ " + days + " يوم";
            document.getElementById("sub-part").innerHTML = "⏰ " + hours + " ساعة و " + minutes + " دقيقة و " + seconds + " ثانية";
        }, 1000);
    </script>
</body>
</html>
